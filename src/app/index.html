<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Unica+One&family=Zen+Dots&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header>
            <span class="material-symbols-outlined" id="logo">planet</span>
            <h1>TESS Candidate Vetting</h1>
        </header>
        <hr>
        <section id="section-main">
            <section id="subsection-param">
                <div id="pos" class="input-container">
                    
                </div>
                <hr>
                <div id="stellar" class="input-container">
                    
                </div>
                <hr>
                <div id="planet" class="input-container">
                    
                </div>
                <hr>
                <div id="submit">
                    <button id="submit-btn">
                        Submit<span class="material-symbols-outlined" id="submit-icon">arrow_outward</span>
                    </button>
                </div>
                <hr>
            </section>
            <section id="subsection-result">
                <div>
                    <h4>Prediction</h4>
                    <h1 id="pred-result">None</h1>
                </div>
            </section>
        </section>
        <script src="/static/index.js" defer></script>
    </body>
</html>
